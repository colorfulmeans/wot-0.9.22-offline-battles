name: Publish v0.8.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.8.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download the tested Windows launcher artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh run download 34728463051
          -n wot-offline-battles-launcher
          -D launcher-download

      - name: Package a single-layer release ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path('launcher-download')
          output = Path('WoT-Offline-Battles-0.8.0-Windows-x64.zip')
          launcher = root / 'WoT-Offline-Battles-Launcher.exe'
          if not launcher.is_file():
              raise SystemExit('tested launcher artifact is missing the launcher executable')

          with ZipFile(output, 'w', ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())

          with ZipFile(output) as archive:
              names = archive.namelist()
          if 'WoT-Offline-Battles-Launcher.exe' not in names:
              raise SystemExit('launcher is not at the ZIP root')
          top_level_zips = [
              name for name in names
              if name.lower().endswith('.zip') and '/' not in name.rstrip('/')
          ]
          if top_level_zips:
              raise SystemExit(
                  'release archive contains a nested top-level ZIP: %r' % top_level_zips)
          if '_internal/client/0.9.22.zip' not in names:
              raise SystemExit('bundled 0.9.22 client payload is missing')
          print('Single-layer release ZIP verified:', output)
          PY

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          本版本基于 v0.7.7，重点重做车辆接触和弹药架爆炸后的炮塔物理，使近距离顶推、侧贴和炮塔落地表现更合理，同时修复高帧率下炮塔动画仍明显卡顿的问题。

          - **重做车辆碰撞响应**：碰撞双方按车辆质量、相对运动和履带抓地力传递动量，重车与轻车之间的推动关系更合理，减少 Bot 无视吨位持续顶动玩家的情况。
          - **改善贴车后的 Bot 脱困**：Bot 与玩家持续接触后不会直接停住放弃，而会继续尝试倒车、转向和脱离；能否脱困仍受双方质量、动力和接触方向影响。
          - **优化侧向接触与车体旋转**：限制接触状态下不合理的横移和车体转动，减少贴住后直接滑过、转过去的现象。
          - **重做飞脱炮塔刚体**：弹药架爆炸后飞出的炮塔具有实际碰撞体积，可与地面、场景和车辆发生接触、滚动和受力，不再只是悬空或穿透的视觉物体。
          - **优化炮塔落地与接触同步**：改进地面法线、支撑判断、线性/角向冲量与状态同步，使炮塔落到地形或车辆上时更稳定。
          - **修复爆弹药架炮塔播放卡顿**：限制炮塔状态追帧和修正幅度并平滑回放，减少“游戏帧率很高，但炮塔飞出时仍一顿一顿”的现象。
          - **增强测试与构建验证**：补充车辆质量响应、持续接触、Bot 脱困、炮塔刚体、接触同步等测试；Windows 下载包改为单层 ZIP，解压一次即可直接运行。

          本发布对应已测试提交 `672bebf`，GitHub Actions 完整测试已通过。

          ### 如何更新

          1. 关闭游戏和旧版启动器，将新版 ZIP **完整解压一次**。
          2. 运行 `WoT-Offline-Battles-Launcher.exe`，选择游戏目录启动；启动器会自动安装新版模组。
          3. 局域网联机的所有玩家请使用同一版本。

          适用客户端：**国服高清版 0.9.22.0.1 #1513**。
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create v0.8.0
          WoT-Offline-Battles-0.8.0-Windows-x64.zip
          --target 672bebfd82daaa5aab325f92ebf93584c4ebf647
          --title "v0.8.0：车辆碰撞与炮塔物理优化"
          --notes-file RELEASE_NOTES.md
