name: Export launcher editor baseline
on:
  push:
    branches: [fix/094-launcher-bot-editor-20260924]
    paths: [.github/workflows/launcher-editor-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5fda392c88c0987ed110a097e3c668d0be011fa2
          fetch-depth: 1
      - run: git archive --format=zip --output=baseline-5fda392c.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-editor-baseline
          path: baseline-5fda392c.zip
          retention-days: 7
