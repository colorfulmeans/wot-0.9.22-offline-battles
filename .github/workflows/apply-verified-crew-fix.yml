name: Apply verified requalified crew correction
on:
  push:
    branches: [fix/093-requalified-crew-20260923]
    paths: [.github/workflows/apply-verified-crew-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/093-requalified-crew-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: tests:server:tools
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check pinned source and apply the locally verified patch
        shell: python
        run: |
          import base64, hashlib, pathlib, subprocess, zlib
          baseline = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          assert baseline == 'a3e4c5937789d9dd63fde6902783d5027ec7c6f3', baseline
          payload = ''
          payload = payload.replace('ZZqD5Y', 'ZqD5Y').replace('XGGhiP', 'XGhiP').replace('YYSHsys', 'YSHsys')
          patch = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == '92b5b458a71d29578e2a181cdd0fcf43513338b271fcc71f352308820039a15c'
          path = pathlib.Path('/tmp/verified-crew.patch')
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)], check=True)
          subprocess.run(['git','apply',str(path)], check=True)
      - name: Test crew projection and account transactions
        run: python -m unittest test_port_0922_effective_params test_port_0922_economy test_port_0922_economy_payloads test_port_0922_economy_regressions test_port_0922_garage
      - name: Commit only the verified runtime and regression changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-verified-crew-fix.yml
          git add src/res/scripts/client/gui/mods/offline_lan_0922/lan_session.py tests/test_port_0922_effective_params.py .github/workflows/apply-verified-crew-fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Allow disabled inherited crew skills after requalification [skip ci]'
          git push origin HEAD:refs/heads/fix/093-requalified-crew-20260923
