name: Audit branding leftovers

# Final audit after restoring the complete launcher documentation.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-branding-leftovers.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked text files
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess

          raw = subprocess.check_output(['git', 'ls-files', '-z'])
          paths = [p.decode('utf-8') for p in raw.split(b'\0') if p]
          patterns = [
              ('old-version', re.compile(r'0\.7\.[0-9]+', re.I)),
              ('old-author', re.compile(r'pengw0048|org\.peng|\bpeng\b', re.I)),
              ('old-product-name', re.compile(r'World of Tanks Offline Battles|WoT Offline Battles|WoT-Offline-Battles-Launcher', re.I)),
              ('old-repo-name', re.compile(r'(?<!0\.9\.22-)wot-offline-battles', re.I)),
              ('github-build-prefix', re.compile(r'github-[A-Za-z0-9_$\{\}.:-]+', re.I)),
          ]
          totals = {name: 0 for name, _ in patterns}
          print('=== BRANDING AUDIT BEGIN ===')
          for path in paths:
              if path == '.github/workflows/audit-branding-leftovers.yml':
                  continue
              try:
                  data = open(path, 'rb').read()
              except OSError:
                  continue
              if b'\0' in data:
                  continue
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  labels = []
                  for name, pattern in patterns:
                      if pattern.search(line):
                          totals[name] += 1
                          labels.append(name)
                  if labels:
                      print('%s:%d [%s] %s' % (path, lineno, ','.join(labels), line[:500]))
          print('=== BRANDING AUDIT TOTALS ===')
          for name in sorted(totals):
              print('%s=%d' % (name, totals[name]))
          print('=== BRANDING AUDIT END ===')
          if any(totals.values()):
              raise SystemExit('branding leftovers remain')
          PY
