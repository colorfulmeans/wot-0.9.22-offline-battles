name: Verify native role reset
on:
  push:
    branches: [fix/093-requalified-crew-20260923]
    paths: [.github/workflows/apply-verified-role-reset.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/093-requalified-crew-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: tests:server:tools
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply the hash-verified locally tested patch
        shell: python
        run: |
          import base64, hashlib, pathlib, subprocess, zlib
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          assert parent == 'e45ddc22093c76b43769d7cfa6a5d9e464142267', parent
          payload = ''
          patch = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == '0dc5b07c137017f1a8756591965f657fa90f3d1946386645c9a382a9d9021719'
          path = pathlib.Path('/tmp/native-role-reset.patch')
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)], check=True)
          subprocess.run(['git','apply',str(path)], check=True)
      - name: Verify all 444 targeted tests
        run: python -m unittest test_port_0922_effective_params test_port_0922_economy test_port_0922_economy_payloads test_port_0922_economy_regressions test_port_0922_garage
      - name: Commit tested changes and remove transfer workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-verified-role-reset.yml
          git add src/res/scripts/client/gui/mods/offline_lan_0922/lan_session.py src/res/scripts/client/gui/mods/offline_lan_0922/account_rpc/garage.py tests/test_port_0922_garage.py .github/workflows/apply-verified-role-reset.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Include the native lossless skill reset in requalification [skip ci]'
          git push origin HEAD:refs/heads/fix/093-requalified-crew-20260923
