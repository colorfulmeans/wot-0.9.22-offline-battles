name: Build and publish v1.1.1

on:
  workflow_dispatch:
  push:
    tags: [v1.1.1]

concurrency:
  group: release-111
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/tags/v1.1.1'
    uses: ./.github/workflows/build-launcher.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: wot-0.9.22-offline-battles-windows-*
          merge-multiple: true
          path: verified-launcher
      - name: Prepare the verified launcher release archive
        run: python tools/prepare_release111_assets.py --launcher verified-launcher --output release-assets
      - name: Require the main commit test workflow to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" --jq '.workflow_runs[0] | if .status == "completed" then .conclusion else .status end')
            if [ "$state" = success ]; then exit 0; fi
            case "$state" in failure|cancelled|timed_out|action_required|stale) echo "Main verification failed: $state"; exit 1;; esac
            echo "Waiting for main verification: $state"
            sleep 15
          done
          echo 'Main verification did not finish in time'; exit 1
      - name: Publish the exact main build with English release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1.1" --jq .object.sha > release-tag.txt; then
            test "$(cat release-tag.txt)" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/v1.1.1 -f sha="$GITHUB_SHA" > /dev/null
          fi
          if gh release view v1.1.1 --json isDraft --jq .isDraft > release-draft.txt; then
            test "$(cat release-draft.txt)" = true
            gh release edit v1.1.1 --notes-file docs/releases/v1.1.1.md
          else
            gh release create v1.1.1 --target "$GITHUB_SHA" --draft \
              --title 'v1.1.1 — Clean launcher entries and remove development scenarios' \
              --notes-file docs/releases/v1.1.1.md
          fi
          gh release upload v1.1.1 release-assets/* --clobber
          gh release view v1.1.1 --json assets > uploaded-assets.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {p.name: p.stat().st_size for p in Path('release-assets').iterdir() if p.is_file()}
          actual = {a['name']: a['size'] for a in json.loads(Path('uploaded-assets.json').read_text())['assets']}
          assert len(expected) == 1 and actual == expected, (actual, expected)
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1.1" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit v1.1.1 --draft=false --prerelease=false --latest
