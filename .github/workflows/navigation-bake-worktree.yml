name: Navigation bake worktree
on:
  push:
    branches: [fix/093-clean-navigation-bake-20260923]
    paths: [.github/workflows/navigation-bake-worktree.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Export exact source for local regression work
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/navigation-bake-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-bake-source
          path: ${{ runner.temp }}/navigation-bake-source.zip
          retention-days: 1
