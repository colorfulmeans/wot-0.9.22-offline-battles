name: Navigation bake worktree
on:
  push:
    branches: [fix/093-clean-navigation-bake-20260923]
    paths: [.github/workflows/navigation-bake-worktree.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply locally tested source with before-and-after integrity checks
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          rows = json.loads(Path('.github/navigation-bake-change.json').read_text())
          pending = []
          for row in rows:
              path = Path(row['path'])
              before = path.read_bytes()
              assert blob(before) == row['before'], 'Unexpected source: ' + str(path)
              lines = before.decode('utf-8').splitlines(keepends=True)
              for edit in reversed(row['edits']):
                  text = Path(edit['read_from']).read_text() if 'read_from' in edit else edit['text']
                  lines[edit['start']:edit['end']] = text.splitlines(keepends=True)
              after = ''.join(lines).encode('utf-8')
              assert blob(after) == row['after'], 'Transfer mismatch: ' + str(path)
              pending.append((path, after))
          test = Path('tests/test_port_0922_navigation_collision_bake.py')
          assert blob(test.read_bytes()) == '82cbb322e7a3749328670bb259810bac6eb22ef8'
          for path, data in pending:
              path.write_bytes(data)
          PY
      - name: Run focused regression suites
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_port_0922_navigation*bake*.py' -v 2>&1 | tee "$RUNNER_TEMP/navigation-tests.log"
          python -m unittest discover -s tests -p test_port_0922.py 2>&1 | tee "$RUNNER_TEMP/port-tests.log"
          python -m unittest discover -s tests -p test_port_0922_destructibles_baker.py 2>&1 | tee "$RUNNER_TEMP/destructibles-tests.log"
      - name: Verify graph regression detects old retain-all behavior
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/mutation-tests.log"
          import sys, unittest
          sys.path.insert(0, 'tests')
          import test_port_0922_navigation_collision_bake as t
          t.baker.NAVIGATION_ORIGINAL_MATERIAL_END = t.baker.NAVIGATION_ORIGINAL_MATERIAL_MIN
          suite = unittest.TestSuite([t.CollisionBakeTest('test_fresh_graph_has_identical_cells_links_hazards_and_routes_with_soft_scenery')])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.wasSuccessful() or result.errors or len(result.failures) != 1:
              raise SystemExit('Expected graph regression did not detect the mutation')
          print('EXPECTED FAILURE: retain-all policy reintroduces missing graph cells.')
          PY
      - name: Commit only the bake fix and remove temporary transport files
        run: |
          set -euo pipefail
          rm .github/navigation-bake-change.json .github/navigation-bake-code.txt .github/workflows/navigation-bake-worktree.yml
          git diff --check
          test -z "$(git diff 622bcee043aa2f9b7815773c42de76ab0f98b5ed --name-only -- src navgraphs)"
          git add README.md tools/bake_navigation_0922.py tools/bake_all_navigation_0922.py tests/test_port_0922_navigation_baker.py tests/test_port_0922_navigation_collision_bake.py
          git add -u .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bake navigation from per-model collision materials before graph construction' -m 'Exclude original destructible surfaces before raster and graph generation. Preserve hard/replacement geometry and bridge surfaces. Add binary decode, mixed-material, cold-graph and mutation regressions. No raw-client graphs are regenerated by this source-only change.'
          git push origin HEAD:fix/093-clean-navigation-bake-20260923
          git rev-parse HEAD | tee "$RUNNER_TEMP/navigation-fix-commit.txt"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/navigation-bake-source-fixed.zip"
          git diff 622bcee043aa2f9b7815773c42de76ab0f98b5ed HEAD --binary > "$RUNNER_TEMP/navigation-bake.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-bake-fix-evidence
          path: |
            ${{ runner.temp }}/navigation-*.log
            ${{ runner.temp }}/port-tests.log
            ${{ runner.temp }}/destructibles-tests.log
            ${{ runner.temp }}/mutation-tests.log
            ${{ runner.temp }}/navigation-fix-commit.txt
            ${{ runner.temp }}/navigation-bake-source-fixed.zip
            ${{ runner.temp }}/navigation-bake.patch
          retention-days: 7
