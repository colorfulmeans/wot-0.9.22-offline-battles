name: Validate continuous Airfield egress
on:
  push:
    branches: [maintenance/airfield-225339-continuity]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: transport
      - uses: actions/checkout@v7
        with:
          ref: 96717b1c73cc76b1f4ebf73fdbabfbbb77d22531
          path: work
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply the exact continuous-motion correction
        run: |
          python - <<'PY'
          import hashlib, pathlib, subprocess
          patch = pathlib.Path('transport/airfield-continuity.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == 'f3113c09f45d6ff86cb5835cb7da76ca14b0d840a32a47052fe6498daf635e40'
          subprocess.run(['git','apply','--check','../transport/airfield-continuity.patch'],cwd='work',check=True)
          subprocess.run(['git','apply','../transport/airfield-continuity.patch'],cwd='work',check=True)
          PY
      - name: Run complete affected navigation and Bot regressions
        working-directory: work
        env:
          PYTHONPATH: tests
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          python -m unittest test_port_0922_airfield_live_egress test_port_0922_navigation test_port_0922_ai test_port_0922_bot_runtime test_port_0922_bot_navigation_reports test_port_0922_contact_navigation_regressions test_port_0922_bot_destructible_approach test_port_0922_navigation_clearance test_port_0922_traffic test_port_0922_traffic_jam -v 2>&1 | tee ../validation.log
      - name: Compile all client modules with CPython 2.7.18
        working-directory: work
        run: |
          docker run --rm -v "$PWD:/work" -w /work python:2.7.18 python -c "import os; paths=sorted(os.path.join(d,n) for d,_,ns in os.walk('src/res/scripts/client') for n in ns if n.endswith('.py')); [compile(open(p,'rb').read(),p,'exec') for p in paths]; print('Compiled %d Python 2.7 client modules' % len(paths))"
      - name: Stage only the validated production commit
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name colorfulmeans
          git config user.email colorfulmeans@proton.me
          branch=maintenance/airfield-225339-continuity-result
          test -z "$(git ls-remote --heads origin refs/heads/$branch)"
          git add COMPATIBILITY_REVIEW.md src/res/scripts/client/gui/mods/offline_lan_0922/ai/navigation.py tests/test_port_0922_airfield_live_egress.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Keep native-proven Airfield egress continuous across snapped grid changes"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > ../repair-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: airfield-continuity-validation
          path: |
            validation.log
            repair-commit.txt
            transport/airfield-continuity.patch
          retention-days: 7
