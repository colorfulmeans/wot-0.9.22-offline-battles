name: Tests

on:
  # PR branches run once through pull_request; main still verifies pushes.
  push:
    branches: [main]
  pull_request:
  # Forks do not run push-triggered workflows; dispatch keeps CI available.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  navigation-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build shipping search benchmark
        run: >-
          g++ -O3 -std=c++17 -pthread -I native
          tools/benchmark_navigation_resolution.cpp
          native/offline_navigation.cpp native/offline_async_worker.cpp
          -o /tmp/navigation-resolution
      - name: Verify retained routes, every reverse edge and paired native search
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python tools/check_navigation_resolution.py
          --baseline-ref ca22f9095e917ce3fc09458a82e53593a34015c9
          --output build/navigation-resolution
          --native-executable /tmp/navigation-resolution
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-resolution-evidence
          path: build/navigation-resolution/report.json
      - name: Verify Stalingrad local passages and all authored forward/reverse edges
        run: >-
          python tools/check_stalingrad_local_meshes.py
          --native-executable /tmp/navigation-resolution
          --output build/stalingrad-resolution
      - uses: actions/upload-artifact@v4
        with:
          name: stalingrad-resolution-evidence
          path: build/stalingrad-resolution/report.json
      - name: Verify Siegfried town routes and preserved corner anchors
        run: >-
          python tools/check_stalingrad_local_meshes.py --map 14_siegfried_line
          --native-executable /tmp/navigation-resolution
          --output build/siegfried-resolution
      - uses: actions/upload-artifact@v4
        with:
          name: siegfried-resolution-evidence
          path: build/siegfried-resolution/report.json
      - name: Verify all 41 water-rebaked graphs with the shipping search
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python tools/check_navigation_water.py
          --baseline-ref 100bac61f4d589f4e17b9854b4ed2154b7cda5c7
          --output build/navigation-water
          --native-executable /tmp/navigation-resolution
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-water-evidence
          path: build/navigation-water/report.json
  bot-behavior-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies
        run: python -m pip install Pillow==12.3.0
      - name: Check traffic, withdrawal and slope aiming independently
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: tests:server:src/res/scripts/client
        run: |
          set -euo pipefail
          patterns=(
            'test_port_0922_ai.py'
            'test_port_0922_house_corner_feedback.py'
            'test_diagnostic_log_modes.py'
            'test_port_0922_three_round_handoffs.py'
            'test_port_0922_crush_progress_handoffs.py'
            'test_port_0922_motion_052854.py'
            'test_port_0922_motion_064702.py'
            'test_port_0922_current_rule_lifecycle.py'
            'test_port_0922_himmelsdorf_resolution.py'
            'test_port_0922_basic_slope_pose.py'
            'test_port_0922_eroded_fallback_cycle.py'
            'test_port_0922_route_task_rules.py'
            'test_port_0922_initial_allocation.py'
            'test_port_0922_initial_navigation_handoffs.py'
            'test_port_0922_navigation*.py'
            'test_port_0922_driver*.py'
            'test_port_0922_traffic*.py'
            'test_port_0922_bot*.py'
            'test_bot_shot_ammo_policy.py'
            'test_bot_ammo_late_results.py'
            'test_bot_tier_consumables.py'
            'test_bot_fittings.py'
            'test_artillery_motion_reference.py'
            'test_port_0922_contact*.py'
            'test_port_0922_recovery_return_budget.py'
            'test_port_0922_capture_contact_launch.py'
            'test_port_0922_capture_protection.py'
            'test_port_0922_base_circle_arrival.py'
            'test_port_0922_magazine_followup.py'
            'test_port_0922_windstorm_bridge.py'
            'test_port_0922_windstorm_north.py'
            'test_port_0922_windstorm_middle.py'
            'test_port_0922_e5_wreck_handoff.py'
            'test_port_0922_water_surfaces.py'
            'test_port_0922_water_rebake.py'
            'test_port_0922_recovery_commit_consistency.py'
            'test_port_0922_serene_coast_spawns.py'
            'test_port_0922_posed_direction_probe.py'
            'test_port_0922_motion_hazard_prefix.py'
            'test_replay_capacity.py'
            'test_port_0922_authored_route_progress.py'
            'test_port_0922_crush_progress_handoffs.py'
            'test_port_0922_recovery*.py'
            'test_port_0922_three_round_handoffs.py'
            'test_port_0922_oct03_bot_egress.py'
            'test_port_0922_separation_progress.py'
            'test_port_0922_fjord_departure.py'
            'test_port_0922_airfield_live_egress.py'
            'test_port_0922_wreck*.py'
            'test_port_0922_artillery*.py'
            'test_port_0922_spg*.py'
            'test_port_0922_downhill*.py'
            'test_port_0922_parking*.py'
            'test_port_0922_withdrawal*.py'
            'test_port_0922_gun_angle*.py'
            'test_port_0922_rear_limited_aim.py'
            'test_port_0922_local_action_sweep.py'
            'test_port_0922_combat_tracking_lifecycle.py'
            'test_port_0922_wait_parking.py'
            'test_port_0922_route_recovery_cycle.py'
            'test_port_0922_failed_route_retry.py'
            'test_port_0922_server_bot_ai.py'
            'test_port_0922_target_evidence.py'
            'test_port_0922_terminal_route_handoff.py'
            'test_port_0922_complete_navigation_receipts.py'
            'test_port_0922_withdraw_receipts.py'
            'test_port_0922_scoped_failure_progress.py'
            'test_port_0922_combat_progress_ownership.py'
            'test_port_0922_escape_observation_contract.py'
            'test_port_0922_near_goal_evidence.py'
            'test_port_0922_worker_query_reuse.py'
            'test_port_0922_unknown_water.py'
            'test_port_0922_railway_obstacles.py'
            'test_port_0922_radio_routes.py'
            'test_port_0922_minute_recovery.py'
            'test_port_0922_shot_geometry.py'
            'test_port_0922_tactical_geometry.py'
          )
          arguments=()
          for pattern in "${patterns[@]}"; do
            arguments+=(--pattern "$pattern")
          done
          python tools/run_test_suite.py --jobs 4 --logs build/bot-test-results/traffic "${arguments[@]}"

      - name: Check customization economy and durable rental settlement
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: tests:server:src/res/scripts/client:launcher:launcher/tests
        run: |
          python tools/run_test_suite.py --jobs 4 --logs build/bot-test-results/economy --pattern test_port_0922_garage.py --pattern test_port_0922_account_rpc.py --pattern test_port_0922_economy.py --pattern test_port_0922_economy_payloads.py --pattern test_port_0922_postbattle.py --pattern test_port_0922_default_styles.py --pattern test_port_0922_bootstrap_lifecycle.py
          python tools/run_test_suite.py --directory launcher/tests --jobs 1 --logs build/bot-test-results/customization --pattern test_save_customizations.py
      - name: Check bonds settlement and worker collision preparation
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: tests:server:src/res/scripts/client:launcher
        run: >-
          python tools/run_test_suite.py --jobs 4 --logs build/bot-test-results/bonds
          --pattern test_port_0922_bonds_and_directives.py
          --pattern test_port_0922_ground_filter_batch.py
          --pattern test_port_0922_destructibles.py
          --pattern test_port_0922_world_collision.py
          --pattern test_port_0922_world_ray_reuse.py
      - name: Compile all client code under Python 2.7
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work python:2.7.18 python -c "import os; paths=[os.path.join(base,name) for base,dirs,files in os.walk('src/res/scripts/client') for name in files if name.endswith('.py')]; [compile(open(p,'rb').read(),p,'exec') for p in paths]; print('%d client modules compile under Python 2.7' % len(paths))"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bot-test-results
          path: build/bot-test-results/
          if-no-files-found: error
  native-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Exercise native geometry and background jobs through the Python 2 C API
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:2.7.18 /bin/sh -c '
            set -eu
            g++ -std=c++17 -O3 -fPIC -shared -pthread -DWOT_HOST_PYTHON \
              -fno-fast-math -ffp-contract=off \
              -fno-builtin-sin -fno-builtin-cos -fno-builtin-pow \
              -fno-builtin-hypot -fno-builtin-fmod \
              -I/usr/local/include/python2.7 \
              native/offline_math_batch_geometry.cpp \
              native/offline_async_worker.cpp \
              native/offline_navigation.cpp \
              native/native_visibility_core.cpp \
              native/offline_visibility.cpp \
              native/offline_contact_roster.cpp \
              native/offline_destructible_geometry.cpp \
              native/world_stage.cpp \
              native/navigation_query_stage.cpp \
              native/offline_simulation.cpp \
              native/offline_simulation_control.cpp \
              native/offline_simulation_motion.cpp \
              native/offline_simulation_weapons.cpp \
              native/offline_simulation_navigation.cpp \
              native/offline_math_batch_native.cpp \
              -o /tmp/offline_math_batch_native.so
            g++ -std=c++17 -O2 -fPIC -shared -msse2 -mfpmath=sse \
              -fno-fast-math -ffp-contract=off \
              -I/usr/local/include/python2.7 \
              tools/check_native_destructible_chunks_vector.cpp \
              -o /tmp/native_chunk_vector.so
            export WOT_NATIVE_CHUNK_VECTOR=/tmp/native_chunk_vector.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_math.py \
              /tmp/offline_math_batch_native.so /src/src/res/scripts/client
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_release_math.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_release_ground.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_release_suspension.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_rotation_current.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_driver_geometry.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_driver_aim.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_workers.py \
              /tmp/offline_math_batch_native.so /src/src/res/scripts/client
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_contacts.py \
              /tmp/offline_math_batch_native.so /src/src/res/scripts/client
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_world.py \
              /tmp/offline_math_batch_native.so /src/src/res/scripts/client
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_world_segments.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_turn_world.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_world_pipeline.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_navigation_query.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_simulation.py \
              /tmp/offline_math_batch_native.so /src/src/res/scripts/client
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_simulation_control.py \
              --extension /tmp/offline_math_batch_native.so \
              --client-scripts /src/src/res/scripts/client
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_simulation_navigation.py \
              /tmp/offline_math_batch_native.so /src/src/res/scripts/client --water-only
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_railway_filter.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_control_projection.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_simulation_weapons.py \
              /tmp/offline_math_batch_native.so /src/src/res/scripts/client
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_destructibles.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_box_geometry.py \
              /tmp/offline_math_batch_native.so
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_visibility_frontier.py \
              /tmp/offline_math_batch_native.so
            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -pthread \
              -I native tools/check_native_visibility_frontier.cpp \
              native/offline_visibility.cpp native/native_visibility_core.cpp \
              native/offline_simulation_control.cpp \
              native/offline_async_worker.cpp -o /tmp/wot-visibility-frontier-check
            /tmp/wot-visibility-frontier-check
            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -pthread \
              tools/check_native_simulation_diagnostics.cpp \
              -o /tmp/wot-native-diag-check
            /tmp/wot-native-diag-check
            PYTHONDONTWRITEBYTECODE=1 python tools/check_native_simulation_diagnostics.py \
              /tmp/offline_math_batch_native.so
          '
      - name: Check combat summaries and sight frontier lifetimes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tests -p test_port_0922_worker_diagnostics.py
          python3 -m unittest discover -s tests -p test_port_0922_battle_visibility.py
          python3 -m unittest discover -s tests -p test_native_payload_identity.py
  test:
    needs: windows-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies
        run: python -m pip install Pillow==12.3.0
      - name: Run gameplay follow-up regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest discover -s tests
          -p "test_port_0922_gameplay_followup.py" -v
      - name: Run client test suite
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/run_test_suite.py --jobs 4 --logs build/client-test-results
      - name: Run launcher test suite
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/run_test_suite.py --directory launcher/tests --jobs 2 --logs build/launcher-test-results
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-test-results
          path: |
            build/client-test-results/
            build/launcher-test-results/
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: wot-0.9.22-lan-server-windows
          path: dist
      # Never build into dist/: the client artifact below uploads dist/*,
      # and the launcher job unpacks that before it is packaged.
      - name: Build the native exception trail probe
        run: sh tools/build_native_exception_trail_probe.sh native-probe
      - uses: actions/upload-artifact@v4
        with:
          name: wot-0.9.22-native-exception-trail-probe
          path: native-probe/native_exception_trail.exe
          if-no-files-found: error
      - name: Reproduce the verified recorder resource
        run: python tools/build_replay_runtime.py
      - name: Stage verified style UI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/stage_release_style_ui.py
      - name: Rebuild and verify the shipping x86 native module
        run: sh tools/build_math_batch_native.sh
      - name: Build Python 2.7 0.9.22 LAN client
        run: >-
          docker run --rm --platform linux/amd64 -v "$PWD:/work"
          -e WOT_OFFLINE_DEPOT_STYLE_SWF=/work/build/depot/lobby.swf
          -e WOT_OFFLINE_BUILD_IDENTITY="colorfulmeans-${{ github.run_id }}-${{ github.run_attempt }}"
          -w /work python:2.7.18
          sh -c 'python tests/test_port_0922_barracks_sorting.py -v && python build_wotmod.py'
      - name: Verify all current client bytecode
        run: docker run --rm -v "$PWD:/work" -w /work python:2.7.18 python tools/verify_release0100_code.py dist/org.colorfulmeans.offline_lan_0922_0.10.2.wotmod
      - name: Validate 0.9.22 wotmod package
        run: >-
          python tools/validate_wotmod.py
          dist/org.colorfulmeans.offline_lan_0922_*.wotmod
      - uses: actions/upload-artifact@v4
        with:
          name: wot-0.9.22-lan-client
          path: dist/*
          if-no-files-found: error

  windows-editor-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies
        run: python -m pip install Pillow==12.3.0
      - name: Run actual Tk editor tests on Windows
        run: python tools/run_test_suite.py --directory launcher/tests --jobs 1 --logs build/windows-editor-results
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: windows-editor-results
          path: build/windows-editor-results/
          if-no-files-found: error

  windows-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          architecture: "x64"
      - name: Install pinned Windows server packager
        run: >-
          python -m pip install
          -r server/requirements-windows-build.txt
      - name: Build zero-configuration Windows LAN server
        shell: pwsh
        run: >-
          pwsh -NoProfile -File
          server/build_windows_server.ps1
      - name: Verify x64 executable, fixed listener, and protocol welcome
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $serverRoot = Join-Path $PWD "dist\server"
          $serverExe = Join-Path $serverRoot "WoT-0.9.22-LAN-Server.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "wot-server.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "wot-server.stderr.log"
          $normalizedExe = $serverExe.Replace("/", "\").ToLowerInvariant()
          $identity = "$normalizedExe|28782|any"
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
              $digestBytes = $sha256.ComputeHash(
                  [System.Text.Encoding]::UTF8.GetBytes($identity))
          }
          finally {
              $sha256.Dispose()
          }
          $digest = ([System.BitConverter]::ToString($digestBytes) `
              -replace "-", "").ToLowerInvariant().Substring(0, 12)
          $firewallRuleName = "WoT 0.9.22 LAN Server TCP 28782 - $digest"

          Get-NetFirewallRule `
              -DisplayName $firewallRuleName `
              -ErrorAction SilentlyContinue | Remove-NetFirewallRule

          @'
          import struct
          import sys

          path = sys.argv[1]
          with open(path, 'rb') as stream:
              stream.seek(0x3c)
              pe_offset = struct.unpack('<I', stream.read(4))[0]
              stream.seek(pe_offset + 4)
              machine = struct.unpack('<H', stream.read(2))[0]
          if machine != 0x8664:
              raise SystemExit('expected x64 PE machine, got 0x%04x' % machine)
          '@ | python - $serverExe
          if ($LASTEXITCODE -ne 0) {
              throw "PE architecture check failed"
          }

          $ProtocolProbe = @'
          import json
          import socket

          hello = {
              'type': 'hello',
              'role': 'probe',
              'protocol': 5,
              'client_build': 'wot-0.9.22.0.1-cn-1513',
              'capabilities': ['projectile_ledger_v2',
                               'destructible_catalog_v5',
                               'lean_snapshot_manifest_v1',
                               'ram_contact_ledger_v2',
                               'human_ram_timeline_v1',
                               'player_projectile_owner_v1',
                               'player_environment_v2',
                               'effective_params_v1',
                               'ricochet_continuation_v1'],
              'name': 'CI-Smoke',
              'vehicle': 'ussr:R11_MS-1',
              'vehicle_compact_descr': 'AA==',
              'max_health': 90,
          }
          sock = socket.create_connection(('127.0.0.1', 28782), 5.0)
          try:
              wire = sock.makefile('rwb', buffering=0)
              wire.write((json.dumps(hello) + '\n').encode('utf-8'))
              reply = json.loads(wire.readline().decode('utf-8'))
          finally:
              sock.close()
          assert reply['type'] == 'welcome', reply
          assert reply['protocol'] == 5, reply
          assert reply['client_build'] == hello['client_build'], reply
          assert 'projectile_ledger_v2' in reply['capabilities'], reply
          '@

          $process = Start-Process `
              -FilePath $serverExe `
              -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
          try {
              $deadline = (Get-Date).AddSeconds(30)
              $listening = $false
              while ((Get-Date) -lt $deadline) {
                  if ($process.HasExited) {
                      throw "Windows server exited before opening port 28782"
                  }
                  $listeners = Get-NetTCPConnection `
                      -LocalPort 28782 -State Listen -ErrorAction SilentlyContinue
                  if ($listeners | Where-Object { $_.LocalAddress -eq "0.0.0.0" }) {
                      $listening = $true
                      break
                  }
                  Start-Sleep -Milliseconds 250
              }
              if (-not $listening) {
                  throw "Windows server did not bind 0.0.0.0:28782"
              }

              $ProtocolProbe | python -
              if ($LASTEXITCODE -ne 0) {
                  throw "LAN protocol smoke failed"
              }

              $ruleDeadline = (Get-Date).AddSeconds(20)
              $firewallRule = $null
              while ((Get-Date) -lt $ruleDeadline) {
                  $firewallRule = Get-NetFirewallRule `
                      -DisplayName $firewallRuleName `
                      -ErrorAction SilentlyContinue | Where-Object {
                          $_.Direction -eq "Inbound" -and
                          $_.Enabled -eq "True" -and
                          $_.Action -eq "Allow"
                      } | Select-Object -First 1
                  if ($null -ne $firewallRule) {
                      break
                  }
                  Start-Sleep -Milliseconds 250
              }
              if ($null -eq $firewallRule) {
                  throw "Packaged server did not create its firewall rule"
              }
              $application = $firewallRule | Get-NetFirewallApplicationFilter
              $portFilter = $firewallRule | Get-NetFirewallPortFilter
              if ($application.Program -ne $serverExe) {
                  throw "Firewall rule is not scoped to the packaged EXE"
              }
              if ($portFilter.Protocol -ne "TCP" -or
                      $portFilter.LocalPort -ne "28782") {
                  throw "Firewall rule is not scoped to TCP 28782"
              }
          }
          finally {
              if (-not $process.HasExited) {
                  & taskkill.exe /PID $process.Id /T /F | Out-Null
              }
              if (Test-Path $stdout) {
                  Write-Host "--- server stdout ---"
                  Get-Content $stdout
              }
              if (Test-Path $stderr) {
                  Write-Host "--- server stderr ---"
                  Get-Content $stderr
              }
              Get-NetFirewallRule `
                  -DisplayName $firewallRuleName `
                  -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          }
      - name: Package Windows server download
        shell: pwsh
        run: |
          Compress-Archive -Force `
            -Path dist/server/WoT-0.9.22-LAN-Server.exe,dist/server/README.txt `
            -DestinationPath dist/WoT-0.9.22-LAN-Server-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wot-0.9.22-lan-server-windows
          path: |
            dist/WoT-0.9.22-LAN-Server-Windows.zip
            dist/server/WoT-0.9.22-LAN-Server.exe
            dist/server/README.txt
          if-no-files-found: error

  windows-native-exception-trail:
    # The recorder only exists because #1513 consumes its own unhandled
    # exceptions. Only Windows can show that the vectored handler observes a
    # real first-chance fault, filters it, and leaves the thread untouched.
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wot-0.9.22-native-exception-trail-probe
          path: probe
      - name: Run the first-chance exception trail probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Join-Path $PWD "probe\native_exception_trail.exe"
          & $probe
          if ($LASTEXITCODE -ne 0) {
              throw "native exception trail probe failed ($LASTEXITCODE)"
          }

  windows-launcher:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          architecture: "x64"
      - name: Install pinned Windows packager
        run: >-
          python -m pip install
          -r launcher/requirements-build.txt
      - name: Take the built 0.9.22 client package
        uses: actions/download-artifact@v4
        with:
          name: wot-0.9.22-lan-client
          path: dist
      - name: Build the desktop launcher
        shell: pwsh
        run: pwsh -NoProfile -File launcher/build_launcher.ps1
      - uses: actions/upload-artifact@v4
        id: launcher_download
        with:
          name: wot-0.9.22-offline-battles-launcher
          # Upload the runnable folder; Actions supplies the only outer ZIP.
          path: launcher/dist/wot-0.9.22-offline-battles/
          if-no-files-found: error
          overwrite: true
      - name: Extract the actual download once
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.launcher_download.outputs.artifact-id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/launcher-download
      - name: Verify that the bundled servers run from the launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $download = Join-Path $env:RUNNER_TEMP "launcher-download"
          $launcher = Join-Path $download "wot-0.9.22-offline-battles.exe"
          if (-not (Test-Path -LiteralPath $launcher) -or
                  -not (Test-Path -LiteralPath (Join-Path $download "_internal\client\0.9.22.zip")) -or
                  (Get-ChildItem -LiteralPath $download -Filter *.zip)) {
              throw "Launcher download must run after one ZIP extraction"
          }
          Write-Host "Downloaded launcher is runnable after one ZIP extraction"
          foreach ($port in @("0.9.22")) {
              $process = Start-Process -FilePath $launcher `
                  -ArgumentList "--serve", $port -PassThru -WindowStyle Hidden
              try {
                  $deadline = (Get-Date).AddSeconds(60)
                  $listening = $false
                  while ((Get-Date) -lt $deadline) {
                      if ($process.HasExited) {
                          throw "$port server exited before opening port 28782"
                      }
                      $listeners = Get-NetTCPConnection `
                          -LocalPort 28782 -State Listen -ErrorAction SilentlyContinue
                      if ($listeners | Where-Object { $_.LocalAddress -eq "0.0.0.0" }) {
                          $listening = $true
                          break
                      }
                      Start-Sleep -Milliseconds 250
                  }
                  if (-not $listening) {
                      throw "$port server did not bind 0.0.0.0:28782"
                  }
                  Write-Host "$port server listens through the launcher bundle"
              }
              finally {
                  if (-not $process.HasExited) {
                      & taskkill.exe /PID $process.Id /T /F | Out-Null
                  }
                  $log = Join-Path $env:LOCALAPPDATA "WoTOfflineBattles\server.log"
                  if (Test-Path $log) {
                      Write-Host "--- launcher server log ---"
                      Get-Content $log -Tail 60
                      Remove-Item -LiteralPath $log -Force
                  }
                  Start-Sleep -Seconds 2
              }
          }
