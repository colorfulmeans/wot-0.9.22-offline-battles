name: Publish v0.9.3 release
# Publication is intentionally paused at the user's request while Airfield
# Bot obstruction handling is repaired. Restore the publisher only afterward.
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v0.9.3.yml"]
permissions:
  contents: read
concurrency:
  group: publish-v0.9.3
  cancel-in-progress: true
jobs:
  publication-paused:
    if: github.repository == 'colorfulmeans/wot-0.9.22-offline-battles'
    runs-on: ubuntu-latest
    steps:
      - name: Keep release unpublished until the Airfield fix is ready
        run: echo 'v0.9.3 publication paused; this workflow creates no tag, release or asset.'
