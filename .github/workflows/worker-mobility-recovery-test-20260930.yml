name: Build 0.9.6 mobility recovery test4 20260930
on:
  push:
    branches: [test/096-mobility-recovery-20260930]
    paths:
      - .github/workflows/worker-mobility-recovery-test-20260930.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-096-verified
          run-id: 36480836532
          github-token: ${{ github.token }}
          path: baseline-release
      - name: Restore exact collision-only patch and packaging helper
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mobility.patch.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/mobility.patch.gz.b64 | gzip -d > /tmp/mobility.patch
          echo '65170ea2da0fc57165847a9763c20f22b831ec336fa40fef07babd97c04cac28  /tmp/mobility.patch' | sha256sum -c -
          cat > /tmp/package.py.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/package.py.gz.b64 | gzip -d > /tmp/package.py
          git merge-base --is-ancestor 3fdd95a28fcc18fe38499b2c66a4cbbab34ac0f3 HEAD
          changed="$(git diff --name-only 3fdd95a28fcc18fe38499b2c66a4cbbab34ac0f3 HEAD --)"
          test "$changed" = '.github/workflows/worker-mobility-recovery-test-20260930.yml'
          git apply --check /tmp/mobility.patch
      - name: Record baseline regression identifiers
        shell: bash
        run: |
          set +e
          PYTHONPATH=src/res/scripts/client:tests python -m unittest -q             test_port_0922_world_collision             test_port_0922_downhill_departure             test_port_0922_rollover_bridge             test_port_0922_cliff_impacts             test_port_0922_contact_navigation_regressions             test_port_0922_rotation_contact_runtime             > /tmp/baseline-tests.txt 2>&1
          echo $? > /tmp/baseline-tests.rc
          set -e
      - name: Apply mobility recovery candidate and verify regressions
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/mobility.patch
          python -m py_compile             src/res/scripts/client/gui/mods/offline_lan_0922/world_collision.py             src/res/scripts/client/gui/mods/offline_lan_0922/battle_runtime.py             tests/test_096_mobility_recovery.py
          set +e
          PYTHONPATH=src/res/scripts/client:tests python -m unittest -q             test_port_0922_world_collision             test_port_0922_downhill_departure             test_port_0922_rollover_bridge             test_port_0922_cliff_impacts             test_port_0922_contact_navigation_regressions             test_port_0922_rotation_contact_runtime             > /tmp/candidate-tests.txt 2>&1
          echo $? > /tmp/candidate-tests.rc
          set -e
          PYTHONPATH=src/res/scripts/client:tests python -m unittest -q test_096_mobility_recovery
          python - <<'PY'
          import re
          from pathlib import Path
          def ids(path):
              text=Path(path).read_text(errors='replace')
              return re.findall(r'^(?:FAIL|ERROR): ([^\n]+)', text, re.M)
          base=ids('/tmp/baseline-tests.txt')
          cand=ids('/tmp/candidate-tests.txt')
          if base != cand:
              raise SystemExit('regression identifier mismatch:\nBASE=%r\nCAND=%r' % (base,cand))
          print('existing regression identifiers unchanged:', len(base))
          PY
      - name: Compile the two changed runtime modules with CPython 2.7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compiled
          docker run --rm --platform linux/amd64 -v "$PWD:/work" -w /work             python:2.7.18@sha256:cfa62318c459b1fde9e0841c619906d15ada5910d625176e24bf692cf8a2601d             python -c "import os,py_compile; root='src/res/scripts/client/gui/mods/offline_lan_0922'; out='compiled'; [(py_compile.compile(os.path.join(root,n),cfile=os.path.join(out,n+'c'),dfile='./res/scripts/client/gui/mods/offline_lan_0922/'+n,doraise=True)) for n in ('world_collision.py','battle_runtime.py')]"
          python - <<'PY'
          from pathlib import Path
          for name in ('world_collision.pyc','battle_runtime.pyc'):
              data=(Path('compiled')/name).read_bytes()
              assert data[:4] == b'\x03\xf3\r\n', (name,data[:4])
          print('CPython 2.7 bytecode verified')
          PY
      - name: Build full Windows test package from verified official 0.9.6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          official=baseline-release/wot-0.9.22-offline-battles-0.9.6-Windows-x64.zip
          test -f "$official"
          echo '57cfc178ebabca97b12914e8c9ecbe411e9e60995e6517d70607d7f861283eba  '"$official" | sha256sum -c -
          out=artifact/wot-0.9.22-offline-battles-0.9.6-mobility-recovery-test4-20260930-Windows-x64.zip
          python /tmp/package.py "$official" compiled "$out" | tee artifact/package-verification.txt
          python - <<'PY'
          import io,zipfile
          from pathlib import Path
          outer=Path('artifact/wot-0.9.22-offline-battles-0.9.6-mobility-recovery-test4-20260930-Windows-x64.zip').read_bytes()
          with zipfile.ZipFile(io.BytesIO(outer)) as z:
              client=z.read('_internal/client/0.9.22.zip')
          with zipfile.ZipFile(io.BytesIO(client)) as z:
              w=z.read('mods/0.9.22.0.1/org.colorfulmeans.offline_lan_0922_0.9.6.wotmod')
          Path('artifact/candidate.wotmod').write_bytes(w)
          PY
          python tools/validate_wotmod.py artifact/candidate.wotmod | tee artifact/wotmod-validation.txt
          rm artifact/candidate.wotmod
          cp /tmp/baseline-tests.txt artifact/baseline-regressions.txt
          cp /tmp/candidate-tests.txt artifact/candidate-regressions.txt
          cp /tmp/mobility.patch artifact/mobility-recovery.patch
          cat > artifact/README_ZH.txt <<'TXT'
          WoT 0.9.22 offline battles - 0.9.6 mobility recovery test4
          Build identity: colorfulmeans-096-mobility-recovery-test-20260930-4

          This build starts from the verified official 0.9.6 package.
          It does NOT contain the earlier pose-cache, filter-cache, or suspension-sleep performance experiments.

          Changes under test:
          1. Destination-perimeter terrain profiles are direction-neutral, so a cross-body lane on a bank cannot become an artificial uphill wall only because of polygon winding. Terrain evidence is evaluated at the translated destination pose; upper hull rays still block real walls.
          2. Non-centre track-pivot rotation can use the same strict departing-contact proof as centre rotation. Only an already occupied plane whose penetration is reduced may be released; deeper/new contact remains blocked.
          3. When another vehicle clips requested translation, only the accepted translation fraction consumes the contact traverse drive budget. This targets the FV4005 case where internal road speed remained non-zero while realised travel was zero and A/D had no torque.

          No suspension-sleep/performance changes, no physics time-step changes, no pathfinding changes, no shutdown changes.

          Install: fully exit the game/worker/launcher; extract this package to a new folder; run its launcher and select the existing #1513 game directory. Do not mix _internal folders between builds and do not reset save data.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: mobility-recovery-test4-096
          path: artifact/
          if-no-files-found: error
          retention-days: 30
