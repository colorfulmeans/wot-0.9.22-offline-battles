name: Airfield Python 2.7 compiler bootstrap
on:
  push:
    branches: [fix/093-clean-navigation-bake-20260923]
    paths: [.github/workflows/airfield-compiler-bootstrap.yml]
  pull_request:
    paths: [.github/workflows/airfield-compiler-bootstrap.yml]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export the existing build interpreter for isolated local compilation
        run: |
          mkdir -p compiler
          docker pull python:2.7.18
          docker image inspect python:2.7.18 --format '{{json .RepoDigests}}' > compiler/image-digest.json
          docker run --rm -v "$PWD/compiler:/out" python:2.7.18 sh -c 'cd /usr/local && tar --exclude="*.pyc" --exclude="*.pyo" --exclude="lib/python2.7/site-packages" -czf /out/python27-linux.tgz bin/python2.7 lib/libpython2.7.so.1.0 lib/python2.7'
          sha256sum compiler/python27-linux.tgz > compiler/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: airfield-python27-compiler
          path: compiler/*
          retention-days: 3
          if-no-files-found: error
