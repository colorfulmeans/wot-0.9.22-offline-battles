name: Restore full README and finish branding cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restore-full-readme-and-finish-branding.yml"

permissions:
  contents: write

jobs:
  restore-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore complete launcher README and patch remaining branding
        shell: bash
        run: |
          set -euo pipefail
          git checkout 15af779a169a293d7e7b5f0c4e068d5260d5a12c -- launcher/LAUNCHER_README.txt
          python - <<'PY'
          from pathlib import Path

          def replace_all(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          replace_all('launcher/LAUNCHER_README.txt', [
              ('World of Tanks Offline Battles v0.7.7', 'an earlier release'),
              ('World of Tanks Offline Battles', 'wot-0.9.22-offline-battles'),
              ('wot-offline-battles', 'wot-0.9.22-offline-battles'),
          ])
          replace_all('server/WINDOWS_SERVER_README.txt', [
              ('World of Tanks Offline Battles', 'wot-0.9.22-offline-battles'),
              ('wot-offline-battles', 'wot-0.9.22-offline-battles'),
          ])
          replace_all('tools/bake_mastery_thresholds_0922.py', [
              ('wot-offline-battles', 'wot-0.9.22-offline-battles'),
          ])
          PY
          git diff --check
          echo "Restored launcher README lines: $(wc -l < launcher/LAUNCHER_README.txt)"
          grep -nE '0\.7\.[0-9]+|pengw0048|org\.peng|World of Tanks Offline Battles|WoT Offline Battles|WoT-Offline-Battles-Launcher|(^|[^0-9.])wot-offline-battles|github-[A-Za-z0-9]' launcher/LAUNCHER_README.txt server/WINDOWS_SERVER_README.txt tools/bake_mastery_thresholds_0922.py || true
      - name: Commit restored documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/LAUNCHER_README.txt server/WINDOWS_SERVER_README.txt tools/bake_mastery_thresholds_0922.py
          git commit -m "Restore full launcher documentation and finish branding cleanup"
          git push origin HEAD:main
